    notes: "The comparison now uses one declared curve/prime family for applicability, theorem statements, carriers, partial native selections, canonical property, and sign. Primality is concrete; arithmetic interpretations of the other predicates remain supplied. Certificates must match the preselected generator/target; missing selections and wrong instances are rejected by finite diagnostics. The comparison map, image identity, and positive sign are still supplied, not derived from T_E1-T_E8. Primary torsion-H2/minus-sign and odd-prime/ordinary scope bridges remain open. See formalization/ct_import_audit.md. OddPrimaryBridge also gives a written arithmetic identification of the ordinary compact complex for 1913b1 at three: H1=0, H2=(Z/3)^2, inverse determinant ideal (9). Bases of image nine and eighteen share this ideal but have different square-root behavior. Lean proves the finite presentation, perfect-form normalization and unit obstruction; the arithmetic identification uses external cohomology and primary-bound imports. The subsequent StarkCoreVertices construction establishes rank-one core vertices on this curve using Tate inertia, exact central minus identity, residual cocycle vanishing and cartesian Kummer conditions. Published existence/freeness theorems and the determinant/Stark isomorphism realize bases over Z/27 with the same entire Fitting ladder and different normalized-square rootability. Lean proves the supporting algebra, not the arithmetic existence theorem. Compatible all-level native basis, self-duality and orientation comparisons remain open. See formalization/odd_primary_selmer_bridge.md and formalization/stark_core_vertex_construction.md."
